# Render.com वर webhook_server मोफत deploy करण्यासाठी blueprint
services:
  - type: web
    name: civic-grievance-webhook
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webhook_server:app
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # generateValue वापरू नका - Render base64 किंमत बनवतो आणि त्यात + / =
      # येतात, जे Telegram चा secret_token स्वीकारत नाही (फक्त A-Z a-z 0-9 _ -)
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
