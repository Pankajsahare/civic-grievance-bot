name: Daily Newspaper Grievance Scanner

# स्कॅन करताना फक्त वाचनाची परवानगी; लिहिण्याची परवानगी फक्त commit करणाऱ्या step ला
permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * *'   # 08:30 IST - सकाळची वृत्तपत्रं आल्यानंतर
  workflow_dispatch:

# Scheduled आणि manual run एकाच वेळी चालून state file बिघडू नये
concurrency:
  group: newspaper-scan
  cancel-in-progress: false

jobs:
  scan-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ARTICLES_PER_LEVEL: ${{ vars.ARTICLES_PER_LEVEL }}
          SIMILARITY_THRESHOLD: ${{ vars.SIMILARITY_THRESHOLD }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python newspaper_monitor.py

      - name: Commit State Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update processed issues state"
          file_pattern: sent_issues.json

      # कोणतीही step अयशस्वी झाली तर लगेच Telegram वर सूचना (नाहीतर फक्त GitHub email येतो)
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=⚠️ Daily grievance scan FAILED. No news was checked today. Log: ${RUN_URL}" \
            -o /dev/null -w "Telegram HTTP %{http_code}\n" || true
